<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Buat Kamu</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --pink: #ff5c8a;
      --pink-d: #e63e72;
      --soft: #ffe3ee;
      --ink: #7a2347;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'Quicksand', system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #ffd1e3 0%, #fff 45%, #ffc2d9 100%);
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    .heart {
      position: fixed;
      bottom: -40px;
      pointer-events: none;
      z-index: 0;
      animation: rise linear forwards;
      opacity: .7;
    }

    @keyframes rise {
      to {
        transform: translateY(-115vh) rotate(25deg);
        opacity: 0;
      }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      text-align: center;
      background: rgba(255, 255, 255, .82);
      backdrop-filter: blur(6px);
      border: 2px solid #ffc2d9;
      border-radius: 28px;
      padding: 32px 24px 28px;
      box-shadow: 0 14px 40px rgba(255, 92, 138, .25);
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .dots i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffd1e3;
      transition: .3s;
    }

    .dots i.on {
      background: var(--pink);
      transform: scale(1.25);
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-weight: 400;
      font-size: clamp(1.35rem, 5.5vw, 1.9rem);
      line-height: 1.4;
      margin-bottom: 6px;
      overflow-wrap: anywhere;
    }

    .hint {
      min-height: 1.4em;
      font-size: .95rem;
      opacity: .8;
      margin-bottom: 22px;
    }

    .btns {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      min-height: 70px;
      max-width: 100%;
    }

    button {
      font-family: inherit;
      font-weight: 700;
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 12px 30px;
      min-height: 46px;
      font-size: 1.1rem;
      -webkit-tap-highlight-color: transparent;
      transition: left .25s ease, top .25s ease, transform .25s ease, font-size .2s, padding .2s;
      touch-action: manipulation;
    }

    .yes {
      max-width: 100%;
      background: linear-gradient(135deg, var(--pink), var(--pink-d));
      color: #fff;
      box-shadow: 0 6px 16px rgba(230, 62, 114, .4);
    }

    .no {
      background: #fff;
      color: var(--pink-d);
      border: 2px solid var(--pink);
      z-index: 5;
    }

    .final h1 {
      font-size: clamp(1.5rem, 6.5vw, 2.2rem);
    }

    /* Animasi masuk, intro, dan mengetik */
    .fade {
      animation: fadeIn .6s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .content {
      opacity: 0;
      transition: opacity .4s;
    }

    .content.show {
      opacity: 1;
    }

    .intro {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      font-family: 'Pacifico', cursive;
      font-size: clamp(1.9rem, 8vw, 2.8rem);
      line-height: 1.3;
      transition: opacity .4s;
      pointer-events: none;
    }

    .intro.out {
      opacity: 0;
    }

    .intro.long {
      font-size: clamp(1.5rem, 6.5vw, 2.2rem);
    }

    .rest {
      visibility: hidden;
    }

    .typed.typing {
      border-right: 3px solid var(--pink);
      animation: blink .8s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        border-color: transparent;
      }
    }

    .hint,
    .btns {
      transition: opacity .4s;
    }

    .hide {
      opacity: 0;
      pointer-events: none;
    }

    /* Layar isi nama */
    .name input {
      width: 100%;
      font: inherit;
      font-size: 1.1rem;
      text-align: center;
      color: var(--ink);
      padding: 13px 18px;
      border: 2px solid #ffc2d9;
      border-radius: 999px;
      background: #fff;
      outline: none;
    }

    .name input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 4px rgba(255, 92, 138, .2);
    }

    .err {
      min-height: 1.5em;
      margin: 10px 0 12px;
      color: #d6336c;
      font-weight: 700;
    }

    .shake {
      animation: shake .4s;
    }

    @keyframes shake {

      20%,
      60% {
        transform: translateX(-8px);
      }

      40%,
      80% {
        transform: translateX(8px);
      }
    }

    .final p {
      margin-top: 10px;
      line-height: 1.6;
    }

    /* Tablet */
    @media (min-width:768px) {
      .card {
        max-width: 580px;
        padding: 44px 40px 40px;
        border-radius: 36px;
      }

      .hint {
        font-size: 1.05rem;
        margin-bottom: 30px;
      }

      button {
        font-size: 1.25rem;
        padding: 14px 38px;
        min-height: 54px;
      }

      .btns {
        gap: 22px;
        min-height: 90px;
      }
    }

    /* HP kecil */
    @media (max-width:380px) {
      .card {
        padding: 24px 16px 22px;
        border-radius: 22px;
      }

      button {
        padding: 10px 22px;
        font-size: 1rem;
      }

      .btns {
        gap: 12px;
      }
    }

    /* Layar pendek / HP landscape */
    @media (max-height:520px) {
      .card {
        padding: 16px 20px;
      }

      .dots {
        margin-bottom: 8px;
      }

      .hint {
        margin-bottom: 10px;
      }

      .btns {
        min-height: 56px;
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .heart {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="card" id="card"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
  <script>
    // ====== UBAH BAGIAN INI SESUKAMU ======
    let NAME = ""; // diisi dari kolom nama di awal
    // Label tombol bawaan (dipakai kalau soal tidak punya label sendiri)
    const LABELS = { yes: "Yes", no: "No", start: "Mulai" };

    // Tiap soal bisa punya label tombol sendiri lewat `yes` dan `no`.
    // Hapus salah satunya kalau mau pakai label bawaan di atas.
    const QUESTIONS = [
      {
        text: "Ana cantik sayang ngga yaa sama kin??", mode: "run",
        yes: "Sayang Bangettt", no: "Benci Bangettt",
        hint: "Sayang gaa yaa...."
      },
      {
        text: "Apakah kamu mau terus sama akuu?", mode: "shrink",
        yes: "Mau selamanyaa", no: "Nggak mau",
        hint: "Harusnyaa mauu sihh..."
      },
      {
        text: "Suka ngga yaa kalau aku jailin?", mode: "drift",
        yes: "Gapapa deh", no: "Ngga suka di jailin",
        hint: "Mwehehehe"
      },
      {
        text: "Mau ngga yaa pas nanti ketemu aku ajak jalan keluar?", mode: "text",
        yes: "Mauu Bangett", no: "No",
        hint: "Udh izin bunda, hehe",
        // Soal 4: teks tombol No berganti tiap diklik, lalu berhenti di noFinal
        noTexts: ["Yakin?", "Beneran?", "Coba pikir lagi dong...", "Aku sedih nih", "Please?"],
        noFinal: "Iya deh"
      }
    ];
    const FINAL = {
      title: n => `Yeayyyy! Aku juga sayang kamu, ${n}`,
      text: "Makasihh udahh mau jawab yaaa"
    };
    // =======================================

    const REQUIRED_WORD = /ana/i;                       // kata yang harus ada di nama
    const WRONG_NAME = "Jangan bohong, nama kamuu kan Ana Cantik";

    const card = document.getElementById('card');
    let idx = 0, runId = 0;
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Efek mengetik. Sisa teks tetap ada tapi tak terlihat, jadi tinggi kartu tidak lompat-lompat.
    async function typeText(el, text, id, speed = 48) {
      el.innerHTML = '<span class="typed"></span><span class="rest"></span>';
      const typed = el.querySelector('.typed'), rest = el.querySelector('.rest');
      rest.textContent = text;
      typed.classList.add('typing');
      for (let i = 1; i <= text.length; i++) {
        if (id !== runId) return false;
        typed.textContent = text.slice(0, i);
        rest.textContent = text.slice(i);
        await sleep(reduceMotion ? 0 : speed + Math.random() * 35);
      }
      typed.classList.remove('typing');
      return true;
    }

    // Nama tidak sesuai: tampilkan kalimat bergaya intro (diketik), lalu otomatis lanjut ke soal
    async function showWrongName() {
      const id = ++runId;
      card.style.minHeight = card.offsetHeight + 'px'; // jaga ukuran kartu selama animasi
      card.innerHTML = '<div class="intro long"></div>';
      const intro = card.querySelector('.intro');
      await sleep(reduceMotion ? 0 : 300); if (id !== runId) return;
      if (!(await typeText(intro, WRONG_NAME, id, 60))) return;
      await sleep(reduceMotion ? 0 : 1600); if (id !== runId) return;
      intro.classList.add('out');
      await sleep(reduceMotion ? 0 : 400); if (id !== runId) return;
      card.style.minHeight = '';
      NAME = "Ana Cantik"; idx = 0; render();
    }

    // Layar awal: isi nama
    function showName() {
      runId++;
      card.innerHTML = `
    <div class="name fade">
      <h1>Sebelum mulai, siapa nama kamu?</h1>
      <div class="hint">Tulis namamu di bawah ini ya</div>
      <input id="nameInput" type="text" maxlength="30" placeholder="Nama kamu" autocomplete="off" aria-label="Nama kamu">
      <div class="err" id="err" role="alert"></div>
      <div class="btns"><button class="yes" id="start"></button></div>
    </div>`;
      const input = document.getElementById('nameInput'), err = document.getElementById('err');
      const fail = msg => {
        err.textContent = msg;
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        input.focus();
      };
      const go = () => {
        const v = input.value.trim();
        if (!v) return fail('Isi namanya dulu ya');
        if (!REQUIRED_WORD.test(v)) return showWrongName();
        NAME = v; idx = 0; render();
      };
      const startBtn = document.getElementById('start');
      startBtn.textContent = LABELS.start;
      startBtn.onclick = go;
      input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    }

    async function render() {
      const id = ++runId;
      document.querySelectorAll('.no.floating').forEach(el => el.remove());
      card.classList.remove('shake');
      if (idx >= QUESTIONS.length) return finish();
      const q = QUESTIONS[idx];
      card.innerHTML = `
    <div class="dots">${QUESTIONS.map((_, i) => `<i class="${i <= idx ? 'on' : ''}"></i>`).join('')}</div>
    <div class="content">
      <h1></h1>
      <div class="hint hide">${q.hint || ''}</div>
      <div class="btns hide"><button class="yes"></button><button class="no"></button></div>
    </div>
    <div class="intro"></div>`;
      const content = card.querySelector('.content'), intro = card.querySelector('.intro');
      const h1 = card.querySelector('h1'), hint = card.querySelector('.hint'), btns = card.querySelector('.btns');
      const yes = card.querySelector('.yes'), no = card.querySelector('.no');
      yes.textContent = q.yes ?? LABELS.yes;
      no.textContent = q.no ?? LABELS.no;
      yes.onclick = () => { idx++; render(); };
      setupNo(q, yes, no);
      h1.innerHTML = `<span class="rest">${q.text}</span>`; // tahan tinggi kartu sejak awal

      // 1) Intro "Pertanyaan N" diketik
      await sleep(reduceMotion ? 0 : 350); if (id !== runId) return;
      if (!(await typeText(intro, `Pertanyaan ${idx + 1}`, id, 70))) return;
      await sleep(reduceMotion ? 0 : 900); if (id !== runId) return;
      intro.classList.add('out');
      await sleep(reduceMotion ? 0 : 400); if (id !== runId) return;

      // 2) Pertanyaan diketik
      content.classList.add('show');
      if (!(await typeText(h1, q.text, id))) return;

      // 3) Tombol muncul setelah selesai mengetik
      await sleep(reduceMotion ? 0 : 250); if (id !== runId) return;
      hint.classList.remove('hide'); btns.classList.remove('hide');
    }

    // Pindahkan tombol (posisi fixed) ke titik baru dengan animasi halus
    function moveTo(btn, free) {
      const r = btn.getBoundingClientRect(), pad = 12;
      if (!btn.classList.contains('floating')) {
        // .card memakai backdrop-filter, sehingga position:fixed di dalamnya
        // dihitung terhadap kartu. Pindahkan tombol ke <body> supaya dihitung terhadap layar.
        btn.classList.add('floating');
        btn.style.position = 'fixed';
        btn.style.left = r.left + 'px'; btn.style.top = r.top + 'px';
        document.body.appendChild(btn);
        btn.offsetWidth; // paksa reflow supaya transisi jalan
      }
      const maxX = innerWidth - r.width - pad, maxY = innerHeight - r.height - pad;
      let x, y;
      if (free) { // arah bebas, jarak sedang
        const a = Math.random() * Math.PI * 2, d = 110 + Math.random() * 130;
        x = r.left + Math.cos(a) * d; y = r.top + Math.sin(a) * d;
      } else {    // loncat ke mana saja di layar
        x = Math.random() * maxX; y = Math.random() * maxY;
      }
      btn.style.left = Math.min(Math.max(pad, x), maxX) + 'px';
      btn.style.top = Math.min(Math.max(pad, y), maxY) + 'px';
    }

    // Yes membesar lewat font & padding supaya layout ikut menyesuaikan (tidak menimpa tombol No)
    function growYes(yes, n) {
      const small = innerWidth < 480, maxF = small ? 36 : 68, k = small ? 0.65 : 1;
      yes.style.fontSize = Math.min(maxF, 17.6 + n * 5 * k) + 'px';
      yes.style.padding = `${12 + n * 2 * k}px ${Math.min(30 + n * 5 * k, small ? 56 : 120)}px`;
    }

    function setupNo(q, yes, no) {
      if (q.mode === 'run') {            // Soal 1: kabur terus sampai klik Yes
        const flee = e => { e.preventDefault(); moveTo(no, false); };
        no.addEventListener('pointerenter', flee);
        no.addEventListener('pointerdown', flee);
        no.addEventListener('click', flee);
      }
      if (q.mode === 'shrink') {         // Soal 2: No mengecil, Yes membesar
        let n = 0;
        no.onclick = () => {
          n++;
          no.style.transform = `scale(${Math.max(0.08, 1 - n * 0.12)})`;
          growYes(yes, n);
        };
      }
      if (q.mode === 'drift') {          // Soal 3: No bergeser ke arah bebas
        no.onclick = () => moveTo(no, true);
      }
      if (q.mode === 'text') {           // Soal 4: teks No berubah-ubah, Yes berdenyut
        let n = 0;
        no.onclick = () => {
          if (n >= q.noTexts.length) { idx++; render(); return; }
          no.textContent = q.noTexts[n];
          n++;
          growYes(yes, n);
          if (n >= q.noTexts.length) no.textContent = q.noFinal ?? 'Iya deh';
        };
      }
    }

    function finish() {
      card.innerHTML = `<div class="final fade">
    <h1>${FINAL.title(NAME)}</h1><p>${FINAL.text}</p></div>`;
      celebrate();
    }

    function celebrate() {
      if (typeof confetti !== 'function') return;
      const colors = ['#ff5c8a', '#ffb3cc', '#ffffff', '#e63e72'];
      let shape;
      try { shape = confetti.shapeFromText({ text: '💖', scalar: 2 }); } catch (e) { }
      const end = Date.now() + 3500;
      (function frame() {
        const base = { particleCount: 4, spread: 70, colors, scalar: 2, ...(shape ? { shapes: [shape] } : {}) };
        confetti({ ...base, angle: 60, origin: { x: 0, y: 0.8 } });
        confetti({ ...base, angle: 120, origin: { x: 1, y: 0.8 } });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    // Jaga tombol No yang melayang tetap di dalam layar saat HP diputar / ukuran berubah
    addEventListener('resize', () => {
      const b = document.querySelector('.no.floating');
      if (!b) return;
      const r = b.getBoundingClientRect();
      b.style.left = Math.max(12, Math.min(r.left, innerWidth - r.width - 12)) + 'px';
      b.style.top = Math.max(12, Math.min(r.top, innerHeight - r.height - 12)) + 'px';
    });

    // Love melayang di latar belakang
    setInterval(() => {
      const h = document.createElement('span');
      h.className = 'heart';
      h.textContent = ['💗', '💖', '💕', '🩷', '♥'][Math.floor(Math.random() * 5)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = 16 + Math.random() * 28 + 'px';
      h.style.animationDuration = 6 + Math.random() * 6 + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 12500);
    }, 450);

    showName();
  </script>
</body>

</html>
